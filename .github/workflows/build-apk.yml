name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:      # también se puede lanzar manualmente desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      # ── Frontend ──────────────────────────────────────────────
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Instalar Capacitor
        working-directory: frontend
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build de producción
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://debti-api.onrender.com/api

      # ── Capacitor / Android ───────────────────────────────────
      - name: Agregar plataforma Android
        working-directory: frontend
        run: npx cap add android

      - name: Sincronizar assets
        working-directory: frontend
        run: npx cap sync android

      # ── Compilar APK ──────────────────────────────────────────
      - name: Compilar APK debug
        working-directory: frontend/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      # ── Publicar artefacto ────────────────────────────────────
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Debti-v${{ github.run_number }}
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
