services:
  - type: web
    name: debit-api
    runtime: node
    repo: https://github.com/YOUR_USER/YOUR_REPO
    plan: free
    region: oregon
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: PORT
        value: 3001
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: CORS_ORIGIN
        sync: false

  - type: static
    name: debit-web
    runtime: node
    repo: https://github.com/YOUR_USER/YOUR_REPO
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      # El manifest, el service worker y los iconos deben servirse tal cual —
      # si el catch-all de abajo los reescribe a index.html, el navegador
      # recibe HTML donde esperaba JSON/JS/PNG y Chrome nunca ofrece
      # "Instalar app" (bug real: pasó en el primer deploy de la PWA).
      # Render evalúa las rutas en orden y usa la primera que matchee, por
      # eso estas van ANTES del catch-all de SPA.
      - type: rewrite
        source: /manifest.webmanifest
        destination: /manifest.webmanifest
      - type: rewrite
        source: /sw.js
        destination: /sw.js
      - type: rewrite
        source: /registerSW.js
        destination: /registerSW.js
      - type: rewrite
        source: /icon-192.png
        destination: /icon-192.png
      - type: rewrite
        source: /icon-512.png
        destination: /icon-512.png
      - type: rewrite
        source: /favicon.png
        destination: /favicon.png
      - type: rewrite
        source: /assets/*
        destination: /assets/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Debe incluir /api al final, ej: https://debit-api.onrender.com/api
      - key: VITE_API_URL
        sync: false
