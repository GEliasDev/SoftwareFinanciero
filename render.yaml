# Blueprint de Render: API (Node) + frontend (sitio estático).
# Crear en Render: New → Blueprint → elegir este repo. Las variables con `sync: false`
# se piden al crear el Blueprint (copiarlas del despliegue anterior). Gmail y SMTP son opcionales:
# vacías, la app funciona y esas funciones quedan desactivadas. PORT lo pone Render solo.
services:
  - type: web
    name: debti-api
    runtime: node
    repo: https://github.com/GEliasDev/SoftwareFinanciero
    branch: main
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      # Base de datos (Supabase): mismos valores que backend/.env
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      # Auth: si JWT_SECRET cambia, todas las sesiones se cierran
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 2h
      # URL del frontend (sin / final), ej. https://debti-web.onrender.com
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      # Gmail (movimientos por aprobar). Si GMAIL_TOKEN_KEY cambia, hay que reconectar Gmail.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GMAIL_TOKEN_KEY
        sync: false
      # Correo (resumen semanal y recuperar contraseña); opcional
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    name: debti-web
    runtime: static
    repo: https://github.com/GEliasDev/SoftwareFinanciero
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      # El manifest, el service worker y los iconos deben servirse tal cual —
      # si el catch-all de abajo los reescribe a index.html, el navegador
      # recibe HTML donde esperaba JSON/JS/PNG y Chrome nunca ofrece
      # "Instalar app" (bug real: pasó en el primer deploy de la PWA).
      # Render evalúa las rutas en orden y usa la primera que matchee, por
      # eso estas van ANTES del catch-all de SPA.
      - type: rewrite
        source: /manifest.webmanifest
        destination: /manifest.webmanifest
      - type: rewrite
        source: /sw.js
        destination: /sw.js
      - type: rewrite
        source: /registerSW.js
        destination: /registerSW.js
      - type: rewrite
        source: /icon-192.png
        destination: /icon-192.png
      - type: rewrite
        source: /icon-512.png
        destination: /icon-512.png
      - type: rewrite
        source: /favicon.png
        destination: /favicon.png
      - type: rewrite
        source: /assets/*
        destination: /assets/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Vite 8 exige Node ≥ 20.19
      - key: NODE_VERSION
        value: 22
      # Debe incluir /api al final, ej: https://debti-api.onrender.com/api
      - key: VITE_API_URL
        sync: false
