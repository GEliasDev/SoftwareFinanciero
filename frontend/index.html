<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debti — Finanzas personales</title>

    <!-- PWA: color de la barra de estado/chrome antes de instalar (Android) -->
    <meta name="theme-color" content="#047857" />

    <!-- iOS/Safari no lee el manifest para el modo standalone ni el ícono de
         "Añadir a inicio": necesita sus propias meta tags. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Debti" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background: var(--splash-bg, #f8fafc);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      [data-theme="dark"] #splash { --splash-bg: #0f172a; }
      .splash-logo {
        width: 120px; height: 120px;
        display: flex; align-items: center; justify-content: center;
        animation: splash-pop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
      }
      .splash-logo img { width: 120px; height: 120px; object-fit: contain; }
      .splash-wordmark {
        font-family: 'IBM Plex Sans', system-ui, sans-serif;
        font-size: 22px; font-weight: 700; letter-spacing: -0.5px;
        color: #1e293b; animation: splash-fade 0.4s 0.15s ease both;
      }
      [data-theme="dark"] .splash-wordmark { color: #f1f5f9; }
      .splash-dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: #5B4DF1; opacity: 0.5;
        animation: splash-pulse 1s 0.3s ease-in-out infinite alternate;
      }
      @keyframes splash-pop {
        from { transform: scale(0.6); opacity: 0; }
        to   { transform: scale(1);   opacity: 1; }
      }
      @keyframes splash-fade {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes splash-pulse {
        from { opacity: 0.3; transform: scale(0.8); }
        to   { opacity: 0.8; transform: scale(1.2); }
      }
    </style>
  </head>
  <body>
    <script>
      (function(){var t=localStorage.getItem('debti-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();
    </script>
    <div id="splash" aria-hidden="true">
      <div class="splash-logo">
        <img src="/icon.png" alt="Debti" />
      </div>
      <span class="splash-wordmark">Debti</span>
      <div class="splash-dot"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
